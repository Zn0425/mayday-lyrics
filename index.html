<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>五月天 歌詞本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#06081a;--card:rgba(255,255,255,0.04);--card-h:rgba(255,255,255,0.08);--txt:#e8e0d4;--dim:rgba(232,224,212,0.5);--gold:#d4a853;--gold-d:rgba(212,168,83,0.3)}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}

#sf{position:fixed;inset:0;pointer-events:none;z-index:-1}

.app{display:flex;height:100vh;height:100dvh;position:relative;overflow:hidden}

.mbtn{display:none;position:fixed;top:14px;left:14px;width:44px;height:44px;background:rgba(6,8,26,0.92);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.1);border-radius:12px;z-index:101;cursor:pointer;align-items:center;justify-content:center;flex-direction:column;gap:5px;padding:12px;touch-action:manipulation}
.mbtn span{display:block;width:20px;height:2px;background:var(--gold);border-radius:2px;transition:all .3s}
.mbtn.on span:nth-child(1){transform:rotate(45deg) translate(5px,5px)}
.mbtn.on span:nth-child(2){opacity:0}
.mbtn.on span:nth-child(3){transform:rotate(-45deg) translate(5px,-5px)}

.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0);z-index:99;transition:background .3s;pointer-events:none}
.ov.show{background:rgba(0,0,0,0.6);pointer-events:auto}

.sb{width:260px;min-width:260px;background:rgba(6,8,26,0.97);backdrop-filter:blur(20px);border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;overflow:hidden;transition:transform .3s ease;z-index:100}
.sb-hd{padding:28px 20px 16px;text-align:center;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0}
.sb-hd h1{font-size:22px;font-weight:700;letter-spacing:6px;color:var(--gold);text-shadow:0 0 30px rgba(212,168,83,0.3);margin-bottom:4px}
.sb-hd .sub{font-size:11px;letter-spacing:3px;color:var(--dim);text-transform:uppercase}

.sbox{margin:12px 16px;position:relative;flex-shrink:0}
.sbox input{width:100%;padding:10px 14px 10px 36px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:var(--txt);font-size:13px;outline:none;transition:all .3s}
.sbox input:focus{border-color:var(--gold-d);background:rgba(255,255,255,0.08)}
.sbox input::placeholder{color:var(--dim)}
.sbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--dim);fill:none}

.al{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:8px 0}
.al::-webkit-scrollbar{width:4px}
.al::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}

.ai{display:flex;align-items:center;gap:12px;padding:12px 20px;cursor:pointer;touch-action:manipulation;transition:all .2s;border-left:3px solid transparent;-webkit-user-select:none;user-select:none}
.ai:active,.ai.on{background:rgba(212,168,83,0.1);border-left-color:var(--gold)}
.ad{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:rgba(255,255,255,0.8);box-shadow:0 2px 8px rgba(0,0,0,0.3)}
.ai .inf{overflow:hidden}
.ai .inf .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.ai .inf .y{font-size:11px;color:var(--dim);margin-top:2px}

.sbar{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:center;gap:24px;font-size:11px;color:var(--dim);letter-spacing:1px;flex-shrink:0}
.sbar span{color:var(--gold)}

.mn{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;position:relative}
.mn::-webkit-scrollbar{width:6px}
.mn::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}

.hr{position:relative;padding:80px 60px 50px;overflow:hidden;min-height:280px;display:flex;align-items:center}
.hr-bg{position:absolute;inset:0;transition:all .8s ease}
.hr-c{position:relative;z-index:1}
.hr-c .lb{font-size:13px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:12px;opacity:0;transform:translateY(20px);animation:fiu .6s .2s forwards}
.hr-c h2{font-size:42px;font-weight:700;letter-spacing:2px;line-height:1.3;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,0.5);margin-bottom:8px;opacity:0;transform:translateY(20px);animation:fiu .6s .35s forwards}
.hr-c .yb{display:inline-block;padding:4px 14px;background:rgba(255,255,255,0.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.15);border-radius:20px;font-size:13px;letter-spacing:2px;color:rgba(255,255,255,0.7);opacity:0;transform:translateY(20px);animation:fiu .6s .5s forwards}
.hr-c .sc{display:inline-block;margin-left:10px;padding:4px 14px;background:rgba(212,168,83,0.15);border:1px solid rgba(212,168,83,0.2);border-radius:20px;font-size:13px;letter-spacing:1px;color:var(--gold);opacity:0;transform:translateY(20px);animation:fiu .6s .6s forwards}
.hr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,var(--bg));pointer-events:none}
@keyframes fiu{to{opacity:1;transform:translateY(0)}}

.ss{padding:0 50px 60px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.sc2{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:24px;cursor:pointer;touch-action:manipulation;transition:all .3s;position:relative;overflow:hidden}
.sc2::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:var(--accent,var(--gold));opacity:0;transition:opacity .3s}
.sc2:active{background:var(--card-h);transform:scale(0.98)}
.sc2:active::before{opacity:1}
.sn{font-size:11px;color:var(--dim);letter-spacing:2px;margin-bottom:10px}
.st{font-size:18px;font-weight:600;color:#fff;margin-bottom:12px}
.ss2{font-size:13px;line-height:1.7;color:var(--dim);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc2 .pi{position:absolute;bottom:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center}
.pi svg{width:14px;height:14px;fill:#fff;margin-left:2px}

.mo{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0);display:flex;align-items:center;justify-content:center;pointer-events:none;transition:background .4s}
.mo.on{background:rgba(0,0,0,0.88);pointer-events:auto}
.md{width:90%;max-width:640px;max-height:85vh;background:rgba(12,14,30,0.96);backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,0.08);border-radius:20px;overflow:hidden;opacity:0;transform:translateY(40px) scale(0.95);transition:all .4s cubic-bezier(0.16,1,0.3,1);display:flex;flex-direction:column}
.mo.on .md{opacity:1;transform:translateY(0) scale(1)}
.mh{position:relative;padding:40px 40px 30px;overflow:hidden;flex-shrink:0}
.mh-bg{position:absolute;inset:0}
.mh::after{content:'';position:absolute;bottom:0;left:0;right:0;height:60px;background:linear-gradient(transparent,rgba(12,14,30,0.96))}
.mh-c{position:relative;z-index:1}
.mh-c .al2{font-size:11px;letter-spacing:3px;color:var(--gold);margin-bottom:8px}
.mh-c .st2{font-size:30px;font-weight:700;color:#fff;text-shadow:0 2px 15px rgba(0,0,0,0.5)}
.mc{position:absolute;top:20px;right:20px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:18px;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;z-index:2;transition:all .3s}
.mc:active{background:rgba(255,255,255,0.25)}
.ml{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:24px 40px 40px}
.ml::-webkit-scrollbar{width:4px}
.ml::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px}
.lt{font-size:17px;line-height:2.4;color:rgba(232,224,212,0.9);letter-spacing:0.5px;text-align:center;padding-bottom:20px}
.lt .vp{margin-bottom:2em}

.wp{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:60px}
.wp-icon{font-size:64px;margin-bottom:24px;animation:flt 3s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.wp h2{font-size:28px;font-weight:700;color:var(--gold);letter-spacing:4px;margin-bottom:12px}
.wp p{font-size:15px;color:var(--dim);letter-spacing:1px;line-height:1.8}

.sr{position:absolute;top:100%;left:0;right:0;background:rgba(12,14,30,0.98);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);border-radius:0 0 12px 12px;max-height:300px;overflow-y:auto;z-index:50;display:none}
.sr.show{display:block}
.sri{padding:12px 16px;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;gap:10px;transition:background .2s;font-size:13px}
.sri:active{background:rgba(255,255,255,0.06)}
.sri .st3{color:#fff;font-weight:500}
.sri .sa{color:var(--dim);font-size:11px}

@media(max-width:768px){
  .mbtn{display:flex}
  .sb{position:fixed;top:0;left:0;bottom:0;transform:translateX(-100%);width:280px;box-shadow:4px 0 30px rgba(0,0,0,0.5)}
  .sb.open{transform:translateX(0)}
  .ov{display:block}
  .hr{padding:70px 20px 30px;min-height:200px}
  .hr-c h2{font-size:28px}
  .ss{padding:0 16px 40px}
  .sg{grid-template-columns:1fr}
  .sc2{padding:18px}
  .st{font-size:16px}
  .md{width:95%;max-height:90vh;border-radius:16px}
  .mh{padding:30px 24px 20px}
  .mh-c .st2{font-size:22px}
  .ml{padding:15px 24px 30px}
  .lt{font-size:15px;line-height:2.2}
  .wp{padding:40px 20px}
  .wp h2{font-size:24px}
  .wp p{font-size:14px}
}
</style>
</head>
<body>
<canvas id="sf"></canvas>
<button class="mbtn" id="mb"><span></span><span></span><span></span></button>
<div class="ov" id="ov"></div>

<div class="app">
  <aside class="sb" id="sb">
    <div class="sb-hd">
      <h1>五月天</h1>
      <div class="sub">歌詞本 · LYRICS</div>
    </div>
    <div class="sbox">
      <svg viewBox="0 0 24 24" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="si" placeholder="搜尋歌曲..." autocomplete="off">
      <div class="sr" id="srl"></div>
    </div>
    <div class="al" id="al"></div>
    <div class="sbar">
      <div><span id="ac">0</span> 張專輯</div>
      <div><span id="sc2">0</span> 首歌</div>
    </div>
  </aside>

  <main class="mn" id="mn">
    <div class="wp">
      <div class="wp-icon">🎸</div>
      <h2>五月天 歌詞本</h2>
      <p>點擊左上角 ☰ 選擇專輯<br>或搜尋你喜歡的歌曲</p>
    </div>
  </main>
</div>

<div class="mo" id="mo">
  <div class="md">
    <div class="mh">
      <div class="mh-bg" id="mhb"></div>
      <div class="mh-c">
        <div class="al2" id="mal"></div>
        <div class="st2" id="mst"></div>
      </div>
      <button class="mc" id="mx">&times;</button>
    </div>
    <div class="ml">
      <div class="lt" id="mlt"></div>
    </div>
  </div>
</div>

// Stars
(function(){
  const c=document.getElementById('sf'),x=c.getContext('2d');let s=[];
  function r(){c.width=innerWidth;c.height=innerHeight}
  function mk(){s=[];for(let i=0;i<150;i++)s.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+0.3,a:Math.random(),da:(Math.random()-.5)*.015,c:Math.random()>.7?'rgba(212,168,83,':'rgba(200,210,230,'})}
  function d(){x.clearRect(0,0,c.width,c.height);for(const i of s){i.a+=i.da;if(i.a>1||i.a<.1)i.da*=-1;x.beginPath();x.arc(i.x,i.y,i.r,0,Math.PI*2);x.fillStyle=i.c+i.a+')';x.fill()}requestAnimationFrame(d)}
  r();mk();d();addEventListener('resize',()=>{r();mk()})
})();

// Sidebar
const sb=document.getElementById('sb'),ov=document.getElementById('ov'),mb=document.getElementById('mb');
let sbOpen=false;
function toggleSB(){sbOpen=!sbOpen;sb.classList.toggle('open',sbOpen);ov.classList.toggle('show',sbOpen);mb.classList.toggle('on',sbOpen)}
function closeSB(){if(sbOpen)toggleSB()}
mb.addEventListener('click',toggleSB);
ov.addEventListener('click',closeSB);

// Album list
const alEl=document.getElementById('al');
A.forEach((a,i)=>{
  const d=document.createElement('div');
  d.className='ai';
  d.innerHTML='<div class="ad" style="background:'+a.gradient+'">'+a.year.slice(-2)+'</div><div class="inf"><div class="t">'+a.title+'</div><div class="y">'+a.year+' · '+a.songs.length+' 首</div></div>';
  d.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();selectAlbum(i);closeSB()});
  alEl.appendChild(d);
});
document.getElementById('ac').textContent=A.length;
document.getElementById('sc2').textContent=A.reduce((s,a)=>s+a.songs.length,0);

// Select album
function selectAlbum(idx){
  const a=A[idx];
  document.querySelectorAll('.ai').forEach((e,i)=>e.classList.toggle('on',i===idx));
  const mn=document.getElementById('mn');
  const preview=t=>{const l=t.split('\n').filter(x=>x.trim());return l.slice(0,2).join(' · ')};
  mn.innerHTML='<div class="hr"><div class="hr-bg" style="background:'+a.gradient+';opacity:0.4"></div><div class="hr-c"><div class="lb">專輯</div><h2>'+a.title+'</h2><span class="yb">'+a.year+'</span><span class="sc">'+a.songs.length+' 首歌</span></div></div><div class="ss"><div class="sg">'+a.songs.map((s,i)=>'<div class="sc2" style="--accent:'+a.color+'" data-ai="'+idx+'" data-si="'+i+'"><div class="sn">NO. '+String(i+1).padStart(2,'0')+'</div><div class="st">'+s.title+'</div><div class="ss2">'+preview(s.lyrics)+'</div><div class="pi"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div></div>').join('')+'</div></div>';
  mn.scrollTop=0;
}

// Song click delegation
document.getElementById('mn').addEventListener('click',function(e){
  const card=e.target.closest('.sc2');
  if(card)openLyrics(+card.dataset.ai,+card.dataset.si);
});

// Open lyrics
function openLyrics(ai,si){
  const a=A[ai],s=a.songs[si];
  document.getElementById('mhb').style.background=a.gradient;
  document.getElementById('mal').textContent=a.title+' · '+a.year;
  document.getElementById('mst').textContent=s.title;
  const verses=s.lyrics.split(/\n\n+/).filter(v=>v.trim());
  document.getElementById('mlt').innerHTML=verses.map(v=>'<div class="vp">'+v.trim().split('\n').join('<br>')+'</div>').join('');
  document.getElementById('mo').classList.add('on');
}
function closeLyrics(){document.getElementById('mo').classList.remove('on')}
document.getElementById('mx').addEventListener('click',closeLyrics);
document.getElementById('mo').addEventListener('click',function(e){if(e.target===this)closeLyrics()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLyrics()});

// Search
const si=document.getElementById('si'),srl=document.getElementById('srl');
const allS=[];A.forEach((a,ai)=>a.songs.forEach((s,si)=>allS.push({ai,si,t:s.title,al:a.title})));
si.addEventListener('input',function(){
  const q=this.value.trim().toLowerCase();
  if(!q){srl.classList.remove('show');return}
  const m=allS.filter(s=>s.t.toLowerCase().includes(q)).slice(0,10);
  srl.innerHTML=m.length?m.map(s=>'<div class="sri" data-ai="'+s.ai+'" data-si="'+s.si+'"><span class="st3">'+s.t+'</span><span class="sa">'+s.al+'</span></div>').join(''):'<div class="sri" style="color:var(--dim)">找不到</div>';
  srl.classList.add('show');
});
srl.addEventListener('click',function(e){
  const item=e.target.closest('.sri');
  if(item&&item.dataset.ai!==undefined){selectAlbum(+item.dataset.ai);si.value='';srl.classList.remove('show');closeSB();setTimeout(()=>openLyrics(+item.dataset.ai,+item.dataset.si),200)}
});
si.addEventListener('blur',function(){setTimeout(()=>srl.classList.remove('show'),200)});

selectAlbum(0);
</script>
